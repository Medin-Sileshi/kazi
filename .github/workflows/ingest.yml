name: Ingest Telegram jobs

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "poll or backfill"
        required: true
        default: poll
        type: choice
        options:
          - poll
          - backfill
      days:
        description: "Backfill days (backfill mode only)"
        required: false
        default: "14"

jobs:
  ingest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ingester
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ingester/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Poll channels
        if: ${{ github.event_name == 'schedule' || github.event.inputs.mode == 'poll' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
        run: |
          python poll.py
          python cleanup_junk.py

      - name: Backfill channels
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'backfill' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
        run: |
          python backfill.py --days ${{ github.event.inputs.days || '14' }}
          python cleanup_junk.py
